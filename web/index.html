${S("p2c5","Eigenen Skill anlegen",`<p>In einem neuen Chat <strong>außerhalb</strong> des Projekts senden:</p>${P(`Erstelle mit dem skill-creator einen Skill namens „pressemitteilung-lindenau“. Er soll greifen, wenn ich eine Pressemitteilung für die Stadt Lindenau schreiben lasse. Inhalt:
- Aufbau: Überschrift, Unterzeile, Lead mit den W-Fragen, Zitat, Hintergrund, Kontakt
- Regeln: sachlich, keine Superlative, Sätze höchstens 20 Wörter, Paarform, Datum mit Wochentag (Wochentag im Kalender prüfen), Uhrzeit „15 Uhr“
- Zitate nur als Platzhalter [Zitat Name]
- Ergänzte Fakten mit [prüfen] markieren
- Am Ende eine Liste „Offen zum Prüfen“
- Kontakt: Pressestelle Stadt Lindenau, presse@lindenau.example
Frag mich, wenn dir etwas fehlt.`)}
<p>Claude stellt eventuell Rückfragen und legt den Skill dann an. Je nach Oberfläche bestätigst du das Speichern.</p>`)}
${S("p2c6","Skill testen",`<p>Wieder in einem normalen Chat <strong>außerhalb</strong> des Projekts:</p>${P(`Schreibe eine Pressemitteilung für die Stadt Lindenau: Der Wochenmarkt zieht ab Samstag, 9. Januar 2027 vom Marktplatz auf den Kirchplatz um. Grund: Bauarbeiten am Marktplatz bis Ende Juni 2027.`)}
<p>Prüfe: Hält sich Claude an Aufbau und Regeln, obwohl du nicht im Projekt bist? Dann hat der Skill gegriffen.</p>`)}
${S("p2c7","Projekt oder Skill?",`<div class="tbl"><table><thead><tr><th></th><th>Projekt</th><th>Skill</th></tr></thead><tbody>
<tr><td>Was ist es?</td><td>Ein Arbeitsraum mit Anweisungen, Kontext und Chats</td><td>Eine Arbeitsweise, die Claude überall anwendet</td></tr>
<tr><td>Wo gilt es?</td><td>Nur in Chats dieses Projekts</td><td>In jedem Chat, in dem die Aufgabe passt</td></tr>
<tr><td>Gut für</td><td>Laufende Arbeit mit Material, z. B. die Pressestelle</td><td>Wiederkehrende Abläufe, z. B. „Pressemitteilung schreiben“</td></tr>
</tbody></table></div>
<div class="merk"><b>Faustregel</b>Das Projekt ist das Büro, der Skill ist die Arbeitsanleitung, die man überallhin mitnimmt.</div>`)}
</ol>`},

l3:{min:40,html:`<p>Jana vergleicht: Liefern ChatGPT und Gemini mit denselben Vorgaben ähnliche Ergebnisse? Für die Übung reichen die kostenlosen Stufen.</p>
<ol class="steps">
${S("p3s1","Vorbereitung: zwei Textdateien",`<p>Speichere den Styleguide und die Beispiel-Mitteilung aus Lektion 2 als <span class="path">styleguide.txt</span> und <span class="path">beispiel-pm.txt</span> (zum Beispiel mit dem Windows-Editor).</p>`)}
${S("p3s2","ChatGPT einrichten",`<p><span class="path">chatgpt.com</span> öffnen und anmelden. In den Einstellungen unter <span class="path">Datenkontrollen</span> den Schalter zur Modellverbesserung prüfen (englisch „Improve the model for everyone“).</p>${TIP("Wie bei Claude: ausschalten, sobald dienstliche Inhalte ins Spiel kommen.")}`)}
${S("p3s3","ChatGPT-Projekt anlegen",`<p>In der Seitenleiste bei <span class="path">Projekte</span> auf <span class="path">+</span> klicken, Name „Pressestelle Lindenau“. Dieselben Anweisungen wie in Lektion 2 einfügen und beide .txt-Dateien hochladen.</p>`)}
${S("p3s4","Gemini einrichten",`<p><span class="path">gemini.google.com</span> öffnen. In der Seitenleiste <span class="path">Neues Notebook</span> wählen, Name „Pressestelle Lindenau“, dieselben Anweisungen und beide Dateien als Quellen hinzufügen.</p>${TIP("Unter Aktivität prüfen, ob deine Gemini-Chats gespeichert werden. Mit einem Google-Konto, das auch Gmail und Drive nutzt, besonders sorgfältig sein.")}`)}
${S("p3s5","Gleicher Auftrag überall",`<p>In allen drei Projekten denselben Prompt senden:</p>${P(STICHPUNKTE)}${TIP("Gleiche Anweisungen, gleiche Quellen, gleicher Prompt. Sonst vergleichst du Äpfel mit Birnen.")}`)}
${S("p3s6","Bewerten",`<p>Vergib je Kriterium 0 bis 2 Punkte:</p><div class="tbl"><table><thead><tr><th>Kriterium</th><th>Claude</th><th>ChatGPT</th><th>Gemini</th></tr></thead><tbody>
<tr><td>Hausstil getroffen</td><td></td><td></td><td></td></tr>
<tr><td>Aufbau korrekt</td><td></td><td></td><td></td></tr>
<tr><td>Kein erfundenes Zitat</td><td></td><td></td><td></td></tr>
<tr><td>[prüfen]-Marken gesetzt</td><td></td><td></td><td></td></tr>
<tr><td>Nacharbeit in Minuten</td><td></td><td></td><td></td></tr></tbody></table></div>`)}
${S("p3s7","Fazit notieren",`<p>Welches Werkzeug hat am wenigsten Nacharbeit gebraucht? Welches passt zu den Programmen, die die Stadt Lindenau schon nutzt?</p>`)}
</ol>`},

l4:{min:40,html:`<p>Jana richtet ihre Werkstatt ein: einen Ordner, in dem Claude Code arbeiten darf. Dann lässt sie aus einer Terminliste Social-Media-Entwürfe anlegen.</p>
<ol class="steps">
${S("p4s1","Desktop-App und Git",`<p>Claude-Desktop-App von <span class="path">claude.com/download</span> installieren und anmelden. Git für Windows von <span class="path">git-scm.com</span> installieren, dann die App neu starten.</p>`)}
${S("p4s2","Werkstatt-Ordner anlegen",`<p>Im Explorer unter Dokumente einen leeren Ordner <span class="path">pressestelle-lindenau</span> anlegen.</p>`)}
${S("p4s3","Code-Tab einrichten",`<p>Oben auf <span class="path">Code</span>, dann neue Sitzung. In der Leiste: <span class="path">Dieser Computer</span>, Ordner <span class="path">pressestelle-lindenau</span>, Modus von <span class="path">Auto</span> auf <span class="path">Manuell</span></p>
<details class="hint"><summary>Vergleichsbild anzeigen: So sieht der Code-Tab aus</summary><div class="hintbody">
<div class="shot"><img src="${IMG_START}" alt="Startbildschirm des Code-Tabs in der Claude-Desktop-App mit Eingabefeld und Leiste darunter">
<div class="mk" style="left:42.8%;top:95%;width:4.4%;height:4.2%"><span>1 Ordner</span></div>
<div class="mk" style="left:73%;top:95%;width:3%;height:4.2%"><span>2 Modus</span></div></div>
<ul class="clean"><li><strong>1 Ordner:</strong> Hier steht „wilfr“ (dein ganzer Benutzerordner). Klicken und <span class="path">pressestelle-lindenau</span> wählen.</li>
<li><strong>2 Modus:</strong> Hier steht „Auto“. Klicken und <strong>Manuell</strong> wählen.</li>
<li>Oben links sind Chat und Code als zwei Symbole nebeneinander. Das rechte (<code>&lt;/&gt;</code>) ist der Code-Tab.</li>
<li>Den Hinweis „2 Sitzungen aus der Claude Code CLI importieren“ kannst du ignorieren.</li></ul>
</div></details>${TIP("Den Modus Manuell behalten, bis du dich sicher fühlst. Nie den ganzen Benutzerordner als Arbeitsordner wählen.")}`)}
${S("p4s4","Erster Auftrag: Ordnerstruktur",`${P(`Lege in diesem Ordner die Unterordner eingang, entwuerfe und freigegeben an. Erkläre mir kurz auf Deutsch, was du tust.`)}<p>Beobachte die Freigabe-Frage und klicke auf Erlauben.</p>`)}
${S("p4s5","Testdaten erzeugen lassen",`${P(`Lege in eingang/ eine Datei termine-november.csv mit 8 fiktiven Terminen der Stadt Lindenau an. Spalten: datum, uhrzeit, titel, ort, kurzbeschreibung. Alles frei erfunden, Zeitraum 1. bis 30. November 2026.`)}`)}
${S("p4s6","Erst planen lassen",`${P(`Lies eingang/termine-november.csv. Erkläre mir, wie du für jeden Termin einen Instagram-Entwurf als eigene Datei in entwuerfe/ anlegen würdest: höchstens 600 Zeichen, sachlich, bürgernah, keine Superlative, 3 Hashtags mit #Lindenau. Leg noch nichts an.`)}`)}
${S("p4s7","Umsetzen und freigeben",`${P(`Gut, setz das um. Dateiname: JJJJ-MM-TT_titel.md`)}`)}
${S("p4s8","Stichprobe prüfen",`<p>Öffne zwei Entwürfe. Stimmen Datum, Uhrzeit und Ort mit der Terminliste überein? Ist der Ton sachlich?</p>`)}
${S("p4s9","Mitarbeiter definieren: CLAUDE.md",`<p>Tippe <code>/init</code>, dann:</p>${P(`Ergänze in CLAUDE.md:
- Antworte immer auf Deutsch und erkläre jede Änderung in zwei Sätzen.
- Neue Texte nur in entwuerfe/, Dateiname JJJJ-MM-TT_thema.md.
- Dateien in freigegeben/ nie ändern oder löschen; dorthin verschiebe nur ich.
- Keine erfundenen Zitate, stattdessen [Zitat Name].
- Vor größeren Aufgaben erst einen Plan vorschlagen.`)}`)}
${S("p4s10","Sichern mit Git",`${P(`Leg ein Git-Repository an und mach einen Commit mit einer sinnvollen Beschreibung.`)}${TIP("Nach jedem gelungenen Schritt sichern. So kommst du jederzeit zu einem funktionierenden Stand zurück.")}`)}
</ol>`},

l5:{min:35,html:`<p>Jana lässt Claude Code eine Styleguide-Prüfung durchführen und prüft dabei den Prüfer: Findet der Agent eingebaute Fehler?</p>
<ol class="steps">
${S("p5s1","Styleguide als Datei",`<p>Im Code-Tab, Ordner <span class="path">pressestelle-lindenau</span>:</p>${P(`Lege eine Datei styleguide.md mit genau diesem Inhalt an:

${STYLEGUIDE}`)}`)}
${S("p5s2","Prüfmaterial mit versteckten Fehlern",`${P(`Lege in eingang/archiv/ sechs fiktive Pressemitteilungen der Stadt Lindenau an. Baue in genau zwei davon Verstöße gegen styleguide.md ein, zum Beispiel Superlative oder ein falsches Datumsformat. Schreib die Lösung in loesung.md und verrate sie mir hier nicht.`)}`)}
${S("p5s3","Neue Sitzung starten",`<p>Neue Sitzung im selben Ordner öffnen, damit Claude die Lösung nicht aus dem Gespräch kennt.</p>`)}
${S("p5s4","Prüfauftrag",`${P(`Prüfe alle Dateien in eingang/archiv/ gegen styleguide.md. Öffne loesung.md nicht. Erstelle pruefbericht.md als Tabelle: Datei, Verstoß, betroffene Stelle, Verbesserungsvorschlag. Ändere die Pressemitteilungen selbst nicht.`)}${TIP("Lass Agenten bei Prüfungen einen Bericht schreiben, statt direkt zu ändern. So entscheidest du, was übernommen wird.")}`)}
${S("p5s5","Den Prüfer prüfen",`<p>Öffne <span class="path">loesung.md</span> und vergleiche mit dem Prüfbericht. Hat Claude alle Verstöße gefunden? Hat es Verstöße gemeldet, die keine sind?</p>`)}
${S("p5s6","Projekt und Ordner abgleichen",`<p>Neue Regel: <em>„Uhrzeiten immer ohne :00 schreiben (15 Uhr statt 15:00 Uhr).“</em> Trage sie im Styleguide-Google-Doc (für das Projekt aus Lektion 2) <strong>und</strong> in <span class="path">styleguide.md</span> (für Claude Code) ein.</p>${TIP("Pflege den Styleguide an einer Stelle als Google Doc. Das Projekt holt sich Änderungen über die Drive-Verbindung automatisch (getestet in Lektion 2). Nur die Datei styleguide.md im Ordner von Claude Code musst du bewusst nachziehen.")}`)}
${S("p5s7","Janas Wochenplan",`<div class="tbl"><table><thead><tr><th>Tag</th><th>Aufgabe</th><th>Werkzeug</th></tr></thead><tbody>
<tr><td>Montag</td><td>Social-Media-Entwürfe aus der Terminliste</td><td><span class="chip c3">Claude Code</span></td></tr>
<tr><td>Dienstag</td><td>Pressemitteilung aus Stichpunkten</td><td><span class="chip c2">Projekt</span></td></tr>
<tr><td>Mittwoch</td><td>Interviewvorbereitung für den Bürgermeister</td><td><span class="chip c2">Projekt</span></td></tr>
<tr><td>Freitag</td><td>Wochenprüfung aller Entwürfe gegen den Styleguide</td><td><span class="chip c3">Claude Code</span></td></tr></tbody></table></div><p>Erstelle deinen eigenen Plan nach diesem Muster.</p>`)}
</ol>`},

l6:{min:20,html:`<p>Jana muss ihrer Amtsleitung sagen, welches Abo die Pressestelle braucht.</p>
<ol class="steps">
${S("p6s1","Eigenen Tarif prüfen",`<p>In claude.ai: <span class="path">Einstellungen</span> → <span class="path">Abrechnung</span>. Welcher Tarif ist aktiv, monatlich oder jährlich?</p>`)}
${S("p6s2","Verbrauch ansehen",`<p><span class="path">Einstellungen</span> → <span class="path">Nutzung</span>. Wie viel hast du in Lektion 4 und 5 verbraucht?</p>${TIP("Claude Code verbraucht deutlich mehr als normale Chats. Plane dafür Reserve ein.")}`)}
${S("p6s3","Bedarf schätzen",`<ul class="clean"><li>Wie viele Pressemitteilungen pro Woche?</li><li>Wie viele Social-Media-Beiträge?</li><li>Wie oft Prüfaufträge über viele Dateien?</li><li>Wie viele Personen arbeiten damit?</li></ul>`)}
${S("p6s4","Entscheidungshilfe",`<div class="tbl"><table><thead><tr><th>Situation</th><th>Empfehlung</th></tr></thead><tbody>
<tr><td>Nur Texte, wenige pro Woche</td><td>Standard-Abo bei einem Anbieter (ca. 21–23 €)</td></tr>
<tr><td>Regelmäßig Claude Code</td><td>Claude Pro; bei häufigem Erreichen der Limits Max 5x</td></tr>
<tr><td>Zwei oder mehr Personen</td><td>Team- bzw. Business-Tarif: zentrale Verwaltung, kein Training mit Daten</td></tr>
<tr><td>Echte Behördendaten</td><td>Nur mit Business-Tarif, Auftragsverarbeitungsvertrag (AVV) und Datenschutzbeauftragten</td></tr></tbody></table></div>`)}
${S("p6s5","Kurzvorlage für die Amtsleitung",`${P(`Erstelle mir eine kurze Entscheidungsvorlage (max. eine Seite) für die Amtsleitung der Stadt Lindenau: Einführung eines KI-Abos für die Pressestelle (2 Personen). Inhalte: Zweck, Beispiele aus unserer Arbeit, Tarifoptionen mit ca.-Preisen, Datenschutz (AVV, Datenschutzbeauftragter), Empfehlung. Markiere alles, was ich prüfen muss, mit [prüfen].`)}${TIP("Diesen Prompt im Projekt „Pressestelle Lindenau“ senden. Preise immer im Bestellvorgang gegenprüfen.")}`)}
</ol>`},

l7:{min:40,html:`<p>Duet, dots und Spark sind in Deutschland noch kaum nutzbar. Jana simuliert deshalb, wie ein proaktiver Agent arbeiten würde, und legt Freigabe-Regeln fest.</p>
<ol class="steps">
${S("p7s1","Morgenübersicht simulieren",`<p>Im Projekt „Pressestelle Lindenau“:</p>${P(`Stell dir vor, du bist mein Assistent und erstellst meine Morgenübersicht. Hier ist mein (fiktiver) Posteingang von heute, Montag 9 Uhr:
1. Lindenauer Anzeiger: Anfrage zur Baustelle Hauptstraße, Redaktionsschluss heute 16 Uhr
2. Newsletter eines Softwareanbieters
3. Büro Bürgermeister: Bitte um Redeentwurf für den Neujahrsempfang (Januar)
4. Radio Lindenau: Interviewwunsch, irgendwann diese Woche
5. Kollegin: Urlaubsvertretung nächste Woche klären
Sortiere nach Dringlichkeit, begründe kurz und schlage für Punkt 1 einen Antwortentwurf vor. Sende nichts.`)}`)}
${S("p7s2","Einschätzung prüfen",`<p>Hat Claude Punkt 1 als dringendsten erkannt? Wo hättest du anders priorisiert? Genau diese Fehleinschätzungen nennen die Anbieter als Grenze ihrer Agenten.</p>`)}
${S("p7s3","Freigabe-Regeln festlegen",`<p>Lege fest, was ein Agent in der Pressestelle dürfte. Drei Spalten: <strong>allein</strong>, <strong>nur mit Freigabe</strong>, <strong>nie</strong>.</p>
<details class="hint"><summary>Beispiel anzeigen</summary><div class="hintbody"><div class="tbl"><table><thead><tr><th>Allein</th><th>Nur mit Freigabe</th><th>Nie</th></tr></thead><tbody>
<tr><td>Posteingang sortieren</td><td>Antwort an Journalisten senden</td><td>Zitate des Bürgermeisters erfinden</td></tr>
<tr><td>Entwürfe anlegen</td><td>Social-Media-Beitrag veröffentlichen</td><td>Personenbezogene Daten weitergeben</td></tr>
<tr><td>Termine zusammenfassen</td><td>Termin zusagen</td><td>Dateien in „freigegeben“ löschen</td></tr></tbody></table></div></div></details>`)}
${S("p7s5","Wochenvorschau planen (Geplant)",`<p>Jetzt meldet sich Claude wirklich von selbst, ganz ohne Duet. Im Projekt <span class="path">Pressestelle Lindenau</span> rechts bei <span class="path">Geplant</span> auf <span class="path">Hinzufügen</span> klicken. Als Zeitpunkt <strong>jeden Montag, 8 Uhr</strong> wählen und diese Aufgabe eintragen:</p>${P(`Erstelle meine Wochenvorschau für die Pressestelle Lindenau:
1. Welche Themen aus den Chats der letzten Woche sind noch offen?
2. Schlage drei Social-Media-Beiträge für diese Woche vor (Hausstil laut Styleguide, je höchstens 600 Zeichen).
3. Nenne eine Pressemitteilung, die wir vorbereiten sollten, mit Begründung.
Sende nichts und veröffentliche nichts. Markiere alles, was ich prüfen muss, mit [prüfen].`,"Aufgabe kopieren")}
<p>Das Ergebnis erscheint am Montag als neuer Chat im Projekt. Zum Testen kannst du zusätzlich eine <strong>einmalige</strong> Ausführung in zehn Minuten anlegen.</p>
<details class="hint"><summary>Anmerkung: Geplant oder Agent – was brauche ich wann?</summary><div class="hintbody">
<p>Für vieles, was eine Pressestelle regelmäßig braucht, reicht eine geplante Aufgabe. Sie ist selbst schon ein kleiner Schritt in Richtung Agent, weil Claude ohne dein Zutun loslegt. Drei Unterschiede entscheiden, ob du mehr brauchst:</p>
<div class="tbl"><table><thead><tr><th></th><th>Geplant</th><th>Agent</th></tr></thead><tbody>
<tr><td>Auslöser</td><td>Die Uhr: Montag 8 Uhr, egal was passiert ist</td><td>Ein Ereignis (proaktiver Agent wie Duet) oder dein Auftrag (Claude Code)</td></tr>
<tr><td>Zugriff</td><td>Was im Projekt steckt: Anweisungen, Kontext, Gedächtnis, Chats</td><td>Ordner und Dateien auf dem Rechner (Claude Code) oder Postfach und Apps (Duet)</td></tr>
<tr><td>Ergebnis</td><td>Ein neuer Chat mit Text</td><td>Angelegte oder geänderte Dateien, vorbereitete Entwürfe in anderen Programmen</td></tr>
</tbody></table></div>
<div class="tbl"><table><thead><tr><th>Aufgabe</th><th>Reicht Geplant?</th></tr></thead><tbody>
<tr><td>Montags eine Wochenvorschau mit Themenvorschlägen</td><td>✅ ja</td></tr>
<tr><td>Freitags Social-Media-Ideen für nächste Woche</td><td>✅ ja</td></tr>
<tr><td>Erinnerung an ein fehlendes Zitat am 13. November</td><td>✅ ja</td></tr>
<tr><td>Aus der Terminliste je Termin eine Entwurfsdatei anlegen</td><td>❌ nein, das macht Claude Code</td></tr>
<tr><td>Alle Mitteilungen im Ordner gegen den Styleguide prüfen</td><td>❌ nein, das macht Claude Code</td></tr>
<tr><td>Sofort melden, wenn eine dringende Anfrage eingeht</td><td>❌ nein, das wäre ein proaktiver Agent</td></tr>
</tbody></table></div>
<div class="merk"><b>Faustregel</b>Geplant ist der Wecker, der Agent ist der Sachbearbeiter.</div>
<p>Mit Projekt plus Geplant deckt die Pressestelle einen großen Teil des Alltags ab, ganz ohne Claude Code. Den Agenten braucht sie erst, wenn viele Dateien im Spiel sind.</p>
</div></details>
${TIP("Geplante Aufgaben verbrauchen Nutzungskontingent, auch wenn du nicht dabei bist. Starte mit einer Aufgabe pro Woche und lösche sie, wenn du sie nicht mehr brauchst.")}`)}
${S("p7s6","Gedächtnis prüfen",`<p>Im Projekt rechts bei <span class="path">Gedächtnis</span> auf <span class="path">Ansehen</span> klicken. Was hat sich Claude aus deinen Übungschats gemerkt?</p>
<ul class="clean"><li>Stimmt alles? Falsches oder Veraltetes korrigieren oder löschen.</li><li>Steht dort etwas, das eigentlich eine Dauerregel ist? Dann gehört es in die Anweisungen oder den Styleguide.</li><li>Im Dienst: Sind personenbezogene Angaben gelandet, etwa Namen aus Bürgeranfragen? Dann löschen.</li></ul>
${TIP("Anweisungen und Styleguide schreibst du selbst, das Gedächtnis füllt Claude. Prüfe es deshalb regelmäßig, zum Beispiel einmal im Monat.")}`)}
${S("p7s4","Dein nächster Schritt",`<p>Notiere drei Dinge, die du in der nächsten Woche umsetzt, zum Beispiel ein eigenes Projekt für deinen Kurs „KI in Presse und Öffentlichkeitsarbeit“.</p>${TIP("Beginne mit Stufe 2. Gehe erst zu Stufe 3, wenn eine Aufgabe viele Dateien oder einen festen Wochenrhythmus hat.")}`)}
</ol>`}
};

const SOURCES = `<p class="src">Quellen: <a href="https://code.claude.com/docs/en/desktop-quickstart" target="_blank" rel="noopener">Claude Code Docs</a> · <a href="https://www.inside.com.tw/article/42702-anthropic-claude-duet-proactive-ai-agent" target="_blank" rel="noopener">Claude Duet (INSIDE)</a> · <a href="https://betanews.com/article/openai-dots-agents-chatgpt/" target="_blank" rel="noopener">OpenAI dots (BetaNews)</a> · <a href="https://thenextweb.com/news/google-antigravity-2-desktop-cli-sdk-io-2026" target="_blank" rel="noopener">Antigravity 2.0 (TNW)</a> · <a href="https://www.ai-toolbox.co/gemini-management-and-productivity/gemini-notebooks-organize-chats-2026" target="_blank" rel="noopener">Gemini Notebooks</a> · <a href="https://www.monsterdealz.de/magazin/chatgpt-kosten" target="_blank" rel="noopener">ChatGPT-Preise</a> · <a href="https://www.ssdnodes.com/learn/lang/de/claude-pro-and-max-in-germany-what-you-pay" target="_blank" rel="noopener">Claude-Preise DE</a> · <a href="https://gptprompts.ai/de/gemini-preise" target="_blank" rel="noopener">Gemini-Preise</a></p>`;

/* ---------- Zustand ---------- */
const KEY="kiwerkstatt-v1";
let state={done:{},checks:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.done)state=Object.assign(state,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

/* ---------- Navigation ---------- */
const nav=document.getElementById("nav");
function renderNav(cur){
  nav.innerHTML=`<li><a href="#start" ${cur==="start"?'aria-current="page"':''}><span class="no">◆</span><span>Überblick</span><span></span></a></li>`+
  LESSONS.map((l,i)=>`<li><a href="#${l.id}" ${cur===l.id?'aria-current="page"':''}><span class="no ${state.done[l.id]?'done':''}">${state.done[l.id]?'✓':i+1}</span><span>${l.title}</span><span class="min">${l.min+(PRAXIS[l.id]?PRAXIS[l.id].min:0)}′</span></a></li>`).join("");
  const n=LESSONS.filter(l=>state.done[l.id]).length;
  document.getElementById("progbar").style.width=(n/LESSONS.length*100)+"%";
  document.getElementById("progtxt").textContent=`${n} von ${LESSONS.length} Lektionen erledigt`;
}

function startView(){
  const total=LESSONS.reduce((s,l)=>s+l.min+(PRAXIS[l.id]?PRAXIS[l.id].min:0),0);
  return `<p class="eyebrow">Lernpfad · ${LESSONS.length} Lektionen · ca. ${Math.round(total/60*10)/10} Stunden</p>
  <h1>Claude, ChatGPT und Gemini verstehen und nutzen</h1>
  <p class="lead">Vom Chat über das Projekt bis zum Agenten: Schritt für Schritt, mit Grafiken, Vergleichstabellen und Quiz. Jede Lektion hat einen Praxisteil mit der Pressestelle der Stadt Lindenau.</p>
  <div class="note"><strong>Wozu diese Werkstatt dient:</strong> Sie ist das Begleitmaterial zum Kurs <strong>„KI in Presse- und Öffentlichkeitsarbeit und Social Media“</strong> der Learning Factory. Im Kurs übst du damit, danach arbeitest du in deinem Tempo nach. Dazu gehören der Kompetenz-Zweig (4D-Modell) und, für Fortgeschrittene, Modul 0 „Werkstatt einrichten“. Zur Vertiefung in KI-Kompetenz und Recht gibt es den kostenlosen Kurs <a href="../ki-kompetenz/">„KI-Kompetenz und EU-AI-Act“</a>.</div>
  <div class="goal"><span class="chip c1">Stufe 1 Chat</span><span class="chip c2">Stufe 2 Projekt</span><span class="chip c3">Stufe 3 Agent</span></div>
  ${SCENARIO}
  <div class="lessonlist">${LESSONS.map((l,i)=>`<a href="#${l.id}"><span class="big">${state.done[l.id]?'✓':i+1}</span><span><strong>${l.title}</strong><small>${l.sub}</small></span><span class="min chip">${l.min+(PRAXIS[l.id]?PRAXIS[l.id].min:0)} Min</span></a>`).join("")}</div>
  <div class="note">So lernst du: eine Lektion pro Sitzung, Quiz am Ende, dann „Lektion abgeschlossen“ klicken. Dein Fortschritt bleibt in diesem Browser gespeichert.</div>
  <div class="foot"><span></span><a class="btn primary" href="#l1">Mit Lektion 1 starten</a></div>
  ${SOURCES}`;
}

function quizHTML(l){
  return `<section class="block">${l.id==="l7"?"":"<h2>Kurzquiz</h2>"}<div class="quiz">${l.quiz.map((q,qi)=>`
  <div class="q" data-q="${qi}"><p>${qi+1}. ${q.q}</p><div class="opts">${q.o.map((o,oi)=>`<button type="button" class="opt" data-o="${oi}">${o}</button>`).join("")}</div><div class="fb" hidden></div></div>`).join("")}
  <div class="foot" style="border:0;padding:0"><p class="fb" id="score">0 von ${l.quiz.length} richtig</p><button type="button" class="cbtn" id="qreset">↺ Quiz wiederholen</button></div></div></section>`;
}

function lessonView(l,i){
  const prev=i>0?`<a class="btn" href="#${LESSONS[i-1].id}">← ${LESSONS[i-1].title}</a>`:`<a class="btn" href="#start">← Überblick</a>`;
  const next=i<LESSONS.length-1?`<a class="btn" href="#${LESSONS[i+1].id}">${LESSONS[i+1].title} →</a>`:`<a class="btn" href="#start">Zum Überblick</a>`;
  return l.html+(PRAXIS[l.id]?`<section class="praxis"><h2>Praxis: Pressestelle Lindenau <span class="chip">${PRAXIS[l.id].min} Min</span></h2>${PRAXIS[l.id].html}</section>`:"")+quizHTML(l)+`<div class="foot">${prev}<button type="button" id="donebtn" class="btn ${state.done[l.id]?'isdone':'primary'}">${state.done[l.id]?'✓ Abgeschlossen':'Lektion abgeschlossen'}</button>${next}</div>`+SOURCES;
}

function bind(l){
  // Quiz
  if(l){
    let right=0;
    document.querySelectorAll(".q").forEach(qel=>{
      const q=l.quiz[+qel.dataset.q];
      qel.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
        const oi=+b.dataset.o;
        qel.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.o===q.a)x.classList.add("right");});
        if(oi!==q.a)b.classList.add("wrong");else right++;
        const fb=qel.querySelector(".fb");fb.hidden=false;fb.textContent=(oi===q.a?"Richtig. ":"Nicht ganz. ")+q.e;
        document.getElementById("score").textContent=`${right} von ${l.quiz.length} richtig`;
      }));
    });
    document.getElementById("qreset").addEventListener("click",()=>{route();const qz=document.querySelector(".quiz");if(qz)qz.scrollIntoView({block:"start"});});
    const d=document.getElementById("donebtn");
    d.addEventListener("click",()=>{state.done[l.id]=!state.done[l.id];save();d.className="btn "+(state.done[l.id]?"isdone":"primary");d.textContent=state.done[l.id]?"✓ Abgeschlossen":"Lektion abgeschlossen";renderNav(l.id);});
  }
  // Checklisten
  document.querySelectorAll(".steps input").forEach(cb=>{
    cb.checked=!!state.checks[cb.id];cb.closest("li").classList.toggle("checked",cb.checked);
    cb.addEventListener("change",()=>{state.checks[cb.id]=cb.checked;save();cb.closest("li").classList.toggle("checked",cb.checked);});
  });
  // Downloads nur ausserhalb des Claude-Viewers
  if(/claude/i.test(location.hostname)){document.querySelectorAll(".dl").forEach(e=>e.hidden=true);document.querySelectorAll(".dl-alt").forEach(e=>e.hidden=false);}
  // Kopieren
  document.querySelectorAll(".prompt .cbtn").forEach(btn=>btn.addEventListener("click",()=>{
    const pre=btn.previousElementSibling, txt=pre.textContent, old=btn.textContent;
    const sel=()=>{const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent="Markiert – Strg+C drücken";};
    try{navigator.clipboard.writeText(txt).then(()=>{btn.textContent="Kopiert";setTimeout(()=>btn.textContent=old,1600);},sel);}catch(e){sel();}
  }));
}

function route(){
  const h=(location.hash||"#start").slice(1);
  const i=LESSONS.findIndex(l=>l.id===h);
  const view=document.getElementById("view");
  if(i<0){view.innerHTML=startView();renderNav("start");bind(null);}
  else{view.innerHTML=lessonView(LESSONS[i],i);renderNav(LESSONS[i].id);bind(LESSONS[i]);}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
