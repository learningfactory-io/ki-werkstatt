<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modul 0 Landkarte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: zweiseitige Mindmap, Zentrum in der Mitte, je vier Hauptäste links und rechts; Verbindungen als SVG-Kurven */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#18202e; --muted:#5a6578; --line:#cfd6e2; --accent:#1f4fd1;
  --c1:#1f4fd1; --c2:#b86e00; --c3:#0e8a7a; --c4:#6a3fc8; --c5:#c2384f; --c6:#2f7d32; --c7:#8a5a2b; --c8:#3d6a8f;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141c; --surface:#181e29; --ink:#e7ebf2; --muted:#9aa5b8; --line:#33405a; --accent:#7ea2ff;
  --c1:#7ea2ff; --c2:#f0a83c; --c3:#3fc7b3; --c4:#ab8cff; --c5:#ff7f93; --c6:#6fcf74; --c7:#d9a066; --c8:#7fb2db; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141c; --surface:#181e29; --ink:#e7ebf2; --muted:#9aa5b8; --line:#33405a; --accent:#7ea2ff;
  --c1:#7ea2ff; --c2:#f0a83c; --c3:#3fc7b3; --c4:#ab8cff; --c5:#ff7f93; --c6:#6fcf74; --c7:#d9a066; --c8:#7fb2db; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.35}
header{max-width:1400px;margin:0 auto;padding-block:18px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,3.5vw,2.2rem);margin:0;line-height:1.1}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button{font:inherit;font-size:.88rem;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.tools button:hover{border-color:var(--accent)}
.stage{position:relative;max-width:1400px;margin:0 auto;padding-block:10px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:28px;align-items:center}
.side{display:grid;gap:18px;min-width:0}
.side.left .branch{flex-direction:row-reverse}
.side.left .kids{align-items:flex-end}
.center{font-family:var(--f-display);font-weight:800;font-size:1.35rem;text-align:center;background:var(--ink);color:var(--surface);border-radius:20px;padding:20px 22px;max-width:220px;line-height:1.15;position:relative;z-index:1}
.center small{display:block;font-family:var(--f-body);font-weight:400;font-size:.8rem;opacity:.8;margin-top:6px}
.branch{display:flex;align-items:center;gap:22px;min-width:0}
.bnode{flex:none;font:inherit;font-family:var(--f-display);font-weight:700;font-size:1rem;color:var(--surface);background:var(--c);border:0;border-radius:12px;padding:9px 12px;cursor:pointer;display:flex;gap:7px;align-items:center;max-width:210px;text-align:left;position:relative;z-index:1}
.bnode .cnt{font-family:var(--f-body);font-size:.72rem;font-weight:700;background:rgba(255,255,255,.25);border-radius:99px;padding:1px 7px}
.bnode .tw{transition:transform .2s;display:inline-block}
.branch.closed .bnode .tw{transform:rotate(-90deg)}
.kids{display:flex;flex-direction:column;gap:6px;min-width:0}
.branch.closed .kids{display:none}
.leaf{position:relative;z-index:1;background:var(--surface);border:1.5px solid var(--c);border-radius:9px;padding:5px 10px;max-width:300px;font-size:.88rem}
.leaf b{font-weight:700}
.leaf .d{display:block;color:var(--muted);font-size:.78rem}
.leaf a{color:var(--c);font-weight:700}
.leaf.sub{margin-left:18px;border-style:dashed;font-size:.82rem}
.side.left .leaf.sub{margin-left:0;margin-right:18px}
.leaf.hit{box-shadow:0 0 0 3px var(--c)}
.search{font:inherit;font-size:.88rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;width:180px}
.legend{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--muted);font-size:.82rem;padding-bottom:30px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:900px){
  .map{grid-template-columns:1fr;gap:16px}
  .center{max-width:none;order:-1}
  .side.left .branch,.branch{flex-direction:column;align-items:flex-start;gap:8px}
  .side.left .kids,.kids{align-items:flex-start;padding-left:14px;border-left:3px solid var(--c)}
  .side.left .leaf.sub{margin-right:0;margin-left:18px}
  .bnode{max-width:none}
  .wires{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<header>
 <div><h1>Modul 0: Die Werkstatt einrichten</h1><p class="sub">Die sieben Missionen mit allen Begriffen, Befehlen und Regeln auf einen Blick. Klicke auf einen Ast, um ihn auf- oder zuzuklappen. Stand: 29. Oktober 2026.</p></div>
 <div class="tools"><input class="search" id="q" type="search" placeholder="Suchen, z. B. Commit" aria-label="In der Mindmap suchen"><button type="button" id="openAll">Alle aufklappen</button><button type="button" id="closeAll">Alle zuklappen</button></div>
</header>
<div class="stage" id="stage">
 <svg class="wires" id="wires" aria-hidden="true"></svg>
 <div class="map" id="map"></div>
</div>
<p class="legend">Gestrichelte Kästen sind Ergänzungen und Tipps. Zum Spiel-Modul: doc-tools.org/ki/ki-werkstatt/modul-0/</p>

<script>
const DATA=[
{t:"1 · Landkarte",ic:"🗺️",c:"--c1",side:"right",k:[
 ["Drei Orte","Rechner (Werkstatt) → GitHub (Archiv) → Webseite (Schaufenster)"],
 ["Vier Arbeitsplätze","Browser · Desktop-App · CLI · Cloud"],
 ["Für Modul 0","Desktop-App mit „Dieser Computer“",1],
 ["Cloud","ab Modul 4: Agent arbeitet, auch wenn der Laptop aus ist",1]]},
{t:"2 · Werkzeuge",ic:"🧰",c:"--c2",side:"right",k:[
 ["Claude-Desktop-App","Code-Tab, Abo ab Pro"],
 ["Git","Speicherpunkte und Verbindung zu GitHub"],
 ["GitHub-Konto","learningfactory-io, Logo, Beschreibung"],
 ["Modus „Manuell“","immer fragen, gilt pro Sitzung"],
 ["Freigabe","„Einmal erlauben“ statt „Immer erlauben“",1],
 ["Git-Name und E-Mail","stehen in jedem Commit"]]},
{t:"3 · Repository",ic:"🏗️",c:"--c3",side:"right",k:[
 ["learningfactory-io/ki-werkstatt","auf github.com angelegt"],
 ["README","Projektbeschreibung"],
 ["LICENSE","alle Rechte vorbehalten"],
 ["Sichtbarkeit","vorerst öffentlich"]]},
{t:"4 · Klonen",ic:"⬇️",c:"--c4",side:"right",k:[
 ["Projekte-Ordner","C:\\Users\\wilfr\\Projekte, nicht in OneDrive"],
 ["git clone","Repository zum ersten Mal holen"],
 ["git pull","neuesten Stand holen, zu Beginn jeder Sitzung"],
 ["Werkstatt","Sitzung im Ordner ki-werkstatt"]]},
{t:"5 · CLAUDE.md",ic:"📋",c:"--c5",side:"left",k:[
 ["Arbeitsanweisung","Stellenbeschreibung für Claude"],
 ["Lernmodus","Plan zuerst, Erklärungen, Verständnisfragen"],
 ["Regeln","nichts löschen, Push nur auf Auftrag, nichts Vertrauliches"],
 ["Eigene Regel","„Befehle vorher in einem Satz erklären“",1],
 ["Neue Sitzung","Claude liest CLAUDE.md beim Start"],
 ["Verständnistest","bestanden"]]},
{t:"6 · Ordnerstruktur",ic:"🗂️",c:"--c6",side:"left",k:[
 ["inhalt/lektionen","je Lektion eine Datei (Modul 1)"],
 ["inhalt/fakten.yml","Fakten-Register, # = Kommentar"],
 ["img · dateien · vorlagen","Bilder, Übungsdateien, Aussehen"],
 [".gitkeep","Platzhalter, Git zählt nur Dateien",1]]},
{t:"7 · Commit und Push",ic:"🚀",c:"--c7",side:"left",k:[
 ["git status","modified · untracked · ahead · clean"],
 ["git add","vormerken: Einkaufskorb"],
 ["git commit","Speicherpunkt: Kasse"],
 ["git push","zu GitHub schicken"],
 ["Co-Authored-By","KI-Mitarbeit gekennzeichnet",1],
 ["Konflikt","gleiche Stelle doppelt geändert, Pull beugt vor",1]]},
{t:"Merksätze",ic:"⚖️",c:"--c8",side:"left",k:[
 ["Erst verstehen, dann freigeben","Befehl lesen, bei Unklarheit fragen"],
 ["Pull holt, Push schickt","der Kreislauf"],
 ["Ändern → add → Commit → Push","die Reihenfolge"],
 ["Keine Geheimnisse ins Repository","Passwörter nie in Chat oder Dateien"],
 ["Abschlussprüfung","Werkstatt-Ausweis 🏆"]]}
];

const map=document.getElementById("map"),wires=document.getElementById("wires"),stage=document.getElementById("stage");
let closed={};try{closed=JSON.parse(localStorage.getItem("kiw-mm0"))||{}}catch(e){}
const saveC=()=>{try{localStorage.setItem("kiw-mm0",JSON.stringify(closed))}catch(e){}};
function branchHTML(b,i){return `<div class="branch ${closed[i]?"closed":""}" data-i="${i}" style="--c:var(${b.c})">
 <button type="button" class="bnode" aria-expanded="${!closed[i]}"><span class="tw">▾</span><span>${b.ic} ${b.t}</span><span class="cnt">${b.k.length}</span></button>
 <div class="kids">${b.k.map(k=>`<div class="leaf ${k[2]?"sub":""}"><b>${k[0]}</b><span class="d">${k[1]}</span></div>`).join("")}</div></div>`;}
map.innerHTML=`<div class="side left">${DATA.map((b,i)=>b.side==="left"?branchHTML(b,i):"").join("")}</div>
<div class="center" id="center">Modul 0<small>Werkstatt einrichten</small></div>
<div class="side right">${DATA.map((b,i)=>b.side==="right"?branchHTML(b,i):"").join("")}</div>`;

function draw(){
 if(getComputedStyle(wires).display==="none")return;
 const sr=stage.getBoundingClientRect(),c=document.getElementById("center").getBoundingClientRect();
 wires.setAttribute("viewBox",`0 0 ${sr.width} ${sr.height}`);
 let p="";const cx=c.left-sr.left+c.width/2,cy=c.top-sr.top+c.height/2;
 document.querySelectorAll(".branch").forEach(br=>{
  const left=br.closest(".side").classList.contains("left");
  const col=getComputedStyle(br).getPropertyValue("--c")||"var(--line)";
  const n=br.querySelector(".bnode").getBoundingClientRect();
  const bx=(left?n.right:n.left)-sr.left,by=n.top-sr.top+n.height/2;
  const sx=left?c.left-sr.left:c.right-sr.left;
  p+=`<path d="M${sx},${cy} C${(sx+bx)/2},${cy} ${(sx+bx)/2},${by} ${bx},${by}" stroke="${col}" stroke-width="3" fill="none" opacity=".7"/>`;
  if(!br.classList.contains("closed"))br.querySelectorAll(".leaf").forEach(l=>{const r=l.getBoundingClientRect();
   const ox=(left?n.left:n.right)-sr.left,lx=(left?r.right:r.left)-sr.left,ly=r.top-sr.top+r.height/2;
   p+=`<path d="M${ox},${by} C${(ox+lx)/2},${by} ${(ox+lx)/2},${ly} ${lx},${ly}" stroke="${col}" stroke-width="1.5" fill="none" opacity=".55"/>`;});
 });
 wires.innerHTML=p;
}
document.querySelectorAll(".branch").forEach(br=>br.querySelector(".bnode").onclick=()=>{const i=br.dataset.i;br.classList.toggle("closed");closed[i]=br.classList.contains("closed");
 br.querySelector(".bnode").setAttribute("aria-expanded",!closed[i]);saveC();draw();});
document.getElementById("openAll").onclick=()=>{document.querySelectorAll(".branch").forEach(b=>{b.classList.remove("closed");closed[b.dataset.i]=false;b.querySelector(".bnode").setAttribute("aria-expanded","true")});saveC();draw();};
document.getElementById("closeAll").onclick=()=>{document.querySelectorAll(".branch").forEach(b=>{b.classList.add("closed");closed[b.dataset.i]=true;b.querySelector(".bnode").setAttribute("aria-expanded","false")});saveC();draw();};
document.getElementById("q").oninput=e=>{const v=e.target.value.trim().toLowerCase();
 document.querySelectorAll(".leaf").forEach(l=>{const hit=v.length>1&&l.textContent.toLowerCase().includes(v);l.classList.toggle("hit",hit);if(hit)l.closest(".branch").classList.remove("closed")});draw();};
addEventListener("resize",draw);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
requestAnimationFrame(draw);setTimeout(draw,400);
</script>
</body>
</html>
